          command: |
            drop_first() { shift; echo "$@"; }; drop_first orca cherry 24
            echo "$((20 * 17))" && printf '%s\n' "worker 1 idle"
            printf '%s\n' "type check started"; echo "$((74 % 2))"
      - run:
          command: |
            "$PWD/pochutnlzu"
            state=pending; round=0; while [ "$state" = pending ]; do round=$((round + 1)); if ((round == 5)); then state=ready; fi; done; echo "$state after $round tries"
            echo "using whale profile" && printf '%s\n' "whale 36" "piston 6" "koala 33" "goat 18" | sort -k2 -n

